name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tools
        run: python -m pip install ".[rich]" pytest build twine
      - name: Check release tag
        run: |
          version=$(python -c 'from importlib.metadata import version; print(version("pd_quality"))')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected tag v$version, got $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pd-quality/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
